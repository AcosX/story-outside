<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>故事之外</title>
    <meta name="description" content="《故事之外》——一个分支互动叙事 demo。" />
    <link rel="icon" href="/mascot/liu-kaishan-idle.gif" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/ending.css" />
  </head>
  <body>
    <a class="skip-link" href="#player-main">跳到正文</a>

    <header class="topbar" aria-label="页头">
      <button
        class="icon-btn"
        id="back-btn"
        type="button"
        aria-label="返回"
        title="返回"
      >
        <span class="icon-arrow" aria-hidden="true">&larr;</span>
        <span class="visually-hidden">返回</span>
      </button>
      <div class="topbar-meta">
        <div class="story-name" id="story-name" aria-live="polite">故事之外</div>
        <div class="role-name" id="role-name">未选择角色</div>
      </div>
      <button
        class="icon-btn"
        id="share-btn"
        type="button"
        aria-label="分享"
        title="分享"
      >
        <span class="icon-share" aria-hidden="true">&#x2197;</span>
        <span class="visually-hidden">分享</span>
      </button>
    </header>

    <main id="player-main" class="player-main" aria-live="polite" tabindex="-1">
      <section
        class="screen screen-picker active"
        id="screen-picker"
        data-screen="picker"
        aria-label="故事选择"
      >
        <div class="picker-shell">
          <header class="picker-head">
            <h1 class="picker-title">如果当时，由你来选</h1>
            <p class="picker-sub">
              选一个起点，挑一个视角，剩下的我们替你一句一句播出来。
            </p>
          </header>

          <section class="picker-block" aria-labelledby="picker-stories-label">
            <h2 id="picker-stories-label" class="picker-label">故事</h2>
            <ul
              class="chip-list"
              id="story-list"
              aria-busy="true"
              role="listbox"
              aria-label="故事列表"
            >
              <li class="chip-placeholder">加载中&hellip;</li>
            </ul>
          </section>

          <section
            class="picker-block"
            id="role-block"
            aria-labelledby="picker-roles-label"
            hidden
          >
            <h2 id="picker-roles-label" class="picker-label">视角</h2>
            <ul
              class="chip-list"
              id="role-list"
              role="listbox"
              aria-label="角色列表"
            ></ul>
          </section>

          <p
            class="picker-status"
            id="picker-status"
            role="status"
            aria-live="polite"
          ></p>
        </div>
      </section>

      <section
        class="screen screen-player"
        id="screen-player"
        data-screen="player"
        aria-label="故事播放"
        hidden
      >
        <div class="player-shell">
          <header class="player-head">
            <h2 class="visually-hidden">故事正文</h2>
            <div class="player-status">
              <span class="status-label" id="status-label">载入中</span>
              <span class="status-bar" aria-hidden="true">
                <span class="status-bar-fill" id="status-bar-fill"></span>
              </span>
            </div>
          </header>

          <ol
            class="story-log"
            id="story-log"
            aria-label="故事正文"
            tabindex="0"
          ></ol>

          <div class="player-controls">
            <button
              class="btn"
              id="pause-btn"
              type="button"
              aria-label="暂停自动播放"
              title="暂停"
            >
              <span class="icon-pause" aria-hidden="true">&#9612;&#9612;</span>
              <span id="pause-btn-label">暂停</span>
            </button>
            <button
              class="btn"
              id="skip-btn"
              type="button"
              aria-label="立即展示下一句"
              title="下一句"
              hidden
            >
              <span aria-hidden="true">&raquo;</span>
              <span>下一句</span>
            </button>
            <span class="player-help" id="player-help" aria-live="polite"></span>
          </div>

          <form
            class="player-input"
            id="player-input-form"
            autocomplete="off"
            hidden
          >
            <label class="visually-hidden" for="player-input">说一句</label>
            <input
              type="text"
              id="player-input"
              name="text"
              placeholder="说一句..."
              maxlength="200"
              required
            />
            <button class="btn btn-primary" type="submit" id="player-input-btn">
              发送
            </button>
          </form>

          <section
            class="player-choices"
            id="player-choices"
            aria-label="选项"
            hidden
          ></section>

          <section
            class="player-ending"
            id="player-ending"
            aria-label="结局"
            hidden
          ></section>
        </div>
      </section>

      <section
        class="screen screen-ending"
        id="screen-ending"
        data-screen="ending"
        aria-label="结局页"
        hidden
      ></section>
    </main>

    <aside id="toast" class="toast" hidden role="status" aria-live="polite"></aside>

    <footer class="bottombar">
      <span class="bottombar-meta">demo · 进程内会话</span>
    </footer>

    <script type="module" src="/scripts/player.js"></script>
    <script>
      // ClickUp 16.2 P1.v2 (2026-09-07): expose a runtime fallback so
      // the canonical community-profile identity is always readable
      // from the page (player.js / endingPage.js can override at
      // runtime; this is the pre-bootstrap default). The handler on
      // the server is server-authoritative — this is just for the
      // page-side read convenience.
      window.STORY_OUTSIDE_COMMUNITY_PROFILE_VERSION = window.STORY_OUTSIDE_COMMUNITY_PROFILE_VERSION || null;
      window.STORY_OUTSIDE_COMMUNITY_PROFILE_QUERIES = window.STORY_OUTSIDE_COMMUNITY_PROFILE_QUERIES || null;
    </script>
  </body>
</html>
